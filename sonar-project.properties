sonar.projectKey=node-js-devops-project
sonar.projectName=Node JS DevOps Project
sonar.projectVersion=1.0

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions — skip non-application code from analysis
sonar.exclusions=node_modules/**,coverage/**,public/**,.dockerignore,DockerFile,JenkinsFile,**/*.test.js,**/*.spec.js

# Language
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
